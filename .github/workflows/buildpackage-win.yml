name: Build Windows x64 Simplified Chinese Executables

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'printrun/**'
      - 'locale/**'
      - '*.py'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/buildpackage-win.yml'
  pull_request:
    paths:
      - 'printrun/**'
      - 'locale/**'
      - '*.py'
      - 'tools/**'
      - '.github/workflows/buildpackage-win.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel cython pyinstaller simplejson polygon3 polib pytest -r requirements.txt
      - name: Check and compile catalogs
        run: |
          python tools/check_translations.py
          python tools/compile_translations.py
      - name: Localization regression tests
        run: python -m unittest discover -s tests -p test_localization.py
      - name: Build one-file executables
        run: python tools/build_windows.py
      - name: Verify x64 executables and console help
        run: |
          @'
          import pathlib, struct, subprocess
          for file in pathlib.Path('dist').glob('*.exe'):
              data = file.read_bytes()
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[pe:pe+4] == b'PE\0\0'
              assert struct.unpack_from('<H', data, pe+4)[0] == 0x8664, file
          exe = str(pathlib.Path('dist/Pronsole.exe').resolve())
          version = subprocess.check_output([exe, '--version'], text=True, encoding='utf-8')
          assert '2.2.1+zhcn.1' in version, version
          help_text = subprocess.check_output([exe, '--help'], text=True, encoding='utf-8')
          assert '用法' in help_text and '显示此帮助并退出' in help_text, help_text
          print('PASS: PE AMD64, version and Chinese console help')
          '@ | python -
      - name: Verify frozen Chinese GUI
        run: python tools/smoke_windows.py dist/Pronterface.exe
      - name: Record dependency versions
        run: python -m pip freeze > build-dependencies.txt
      - name: Upload portable executables
        uses: actions/upload-artifact@v4
        with:
          name: Printrun-zh_CN-win_x64
          path: |
            Printrun-*-win_x64.zip
            build-dependencies.txt
          if-no-files-found: error
          retention-days: 90
